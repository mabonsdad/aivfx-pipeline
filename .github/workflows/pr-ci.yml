name: PR CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            infra/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Backend static checks
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          python -m py_compile $(find backend/src -name '*.py')
          python -m pytest backend/tests

      - name: Contract drift check
        run: |
          npm run sync:contracts
          git diff --exit-code -- frontend/src/lib/generated

      - name: Frontend install + lint + build
        run: |
          cd frontend
          npm install
          npm run lint
          npm run build

      - name: Infra install + build + synth
        run: |
          cd infra
          npm install
          npm run build
          npx cdk synth
