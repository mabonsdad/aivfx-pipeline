name: PR CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Backend static checks
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -m py_compile $(find backend/src -name '*.py')

      - name: Frontend install + lint + build
        run: |
          cd frontend
          npm install
          npm run lint
          npm run build

      - name: Infra install + build + synth
        run: |
          cd infra
          npm install
          npm run build
          npx cdk synth
