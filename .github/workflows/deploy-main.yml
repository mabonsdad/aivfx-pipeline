name: Deploy Main

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build backend artifact dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            --platform manylinux2014_aarch64 \
            --implementation cp \
            --python-version 3.10 \
            --only-binary=:all: \
            -r backend/requirements.txt \
            -t backend

      - name: Install infrastructure dependencies
        run: npm install --prefix infra

      - name: Install frontend dependencies
        run: npm install --prefix frontend

      - name: Deploy dev infrastructure
        env:
          FFMPEG_LAYER_ARN: ${{ vars.FFMPEG_LAYER_ARN }}
          REQUESTS_LAYER_ARN: ${{ vars.REQUESTS_LAYER_ARN }}
          LUMALABS_LAYER_ARN: ${{ vars.LUMALABS_LAYER_ARN }}
          WEB_BUCKET_OVERRIDE: ${{ vars.WEB_BUCKET_OVERRIDE }}
          MANAGE_APP_CLOUDFRONT: "false"
          WEB_PUBLIC_BASE_URL: https://www.shwsh.co.uk/experiments/aivfx/
        run: npm run deploy:infra:dev

      - name: Deploy dev frontend
        env:
          DEV_CLOUDFRONT_INVALIDATION_PATH: /experiments/aivfx/*
        run: npm run deploy:frontend:dev
